<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Porsche Coder</title>
<style>
:root{
  --bg:#0e1116; --card:#161b22; --line:#2a3140; --tx:#e6edf3; --sub:#8b98a9;
  --acc:#c8102e; --ok:#2ea86b; --warn:#d9a13b; --bad:#d64545; --btn:#21262d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation}              /* 关双击缩放 */
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font:15px/1.55 -apple-system,"PingFang SC",system-ui,sans-serif;
  height:100%;overflow:hidden;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
body{display:flex;flex-direction:column;
  /* 安全区四边都要让。iPhone Duo 内屏横屏时传感器区在角落，只让 top 不够——
     2026-10-25 真机截图实测：header 右侧「未连接」徽标顶进状态栏。
     走 env() 不用 JS 猜机型：折叠/旋转/换屏自动跟随，横屏时 top 归 0、侧边生效。 */
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px)}
#safeTop{height:env(safe-area-inset-top,0px);flex:0 0 auto;background:var(--bg)}
header{
  padding:10px 16px;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;background:var(--bg);
  flex:0 0 auto;
}
header h1{font-size:17px;margin:0;flex:1;font-weight:600;letter-spacing:.2px}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--btn);color:var(--sub)}
.badge.ok{background:rgba(46,168,107,.18);color:var(--ok)}
.badge.warn{background:rgba(217,161,59,.18);color:var(--warn)}
main{padding:12px 12px calc(28px + env(safe-area-inset-bottom));
  flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;margin-bottom:11px}
h2{font-size:13px;margin:0 0 10px;color:var(--sub);font-weight:600;
  letter-spacing:.6px;display:flex;align-items:center;gap:7px}
h2 .num{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;
  border-radius:50%;background:var(--acc);color:#fff;font-size:11px;font-weight:700}
.backBtn{margin-left:auto;min-height:34px;padding:5px 12px;font-size:13px;
  background:var(--btn);border:1px solid var(--line);border-radius:9px;cursor:pointer}
.backBtn:active{background:var(--acc);border-color:var(--acc);color:#fff}
button{font:inherit;color:var(--tx);background:var(--btn);border:1px solid var(--line);
  border-radius:10px;padding:11px 14px;cursor:pointer;transition:.12s;min-height:44px}
button:active{transform:scale(.975)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
button:disabled{opacity:.42;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>button{flex:1;min-width:96px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* 导航 */
.crumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:12px}
.crumb button{min-height:30px;padding:3px 9px;font-size:12px;background:transparent}
.crumb b{color:var(--acc)}
.crumb .sep{color:var(--sub)}
.list{display:flex;flex-direction:column;gap:7px}
.item{background:var(--btn);border:1px solid var(--line);border-radius:11px;
  padding:11px 12px;cursor:pointer;transition:.12s}
.item:active{transform:scale(.985);border-color:var(--acc)}
.item .lbl{font-size:15px;font-weight:500}
.item .meta{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.5}
.item.sel{border-color:var(--acc);background:rgba(200,16,46,.1)}
.item .cnt{float:right;font-size:11px;color:var(--sub);background:var(--card);
  padding:2px 8px;border-radius:20px}
/* 参数条目 */
.param{border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:8px;background:var(--btn)}
.param .nm{font-size:14.5px;font-weight:500}
.param .meta{font-size:11.5px;color:var(--sub);margin-top:4px;line-height:1.6}
.param .acts{margin-top:9px;display:flex;gap:7px}
.param .acts button{flex:1;font-size:13px;min-height:38px;padding:8px 6px}
.risk-high{color:var(--bad)} .risk-medium{color:var(--warn)} .risk-low{color:var(--ok)}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:20px;
  background:var(--card);color:var(--sub);margin-left:5px;vertical-align:1px}
.tag.ro{background:rgba(217,161,59,.16);color:var(--warn)}
/* 日志 */
.log{font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;
  word-break:break-all;max-height:220px;overflow:auto;background:#0b0e13;
  border-radius:9px;padding:9px 10px;color:#9fb0c3;min-height:64px}
.log .ok{color:var(--ok)} .log .err{color:var(--bad)} .log .info{color:#7f9ec4}
/* 输入 */
input,select{font:inherit;width:100%;padding:11px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--btn);color:var(--tx);min-height:44px}
label{display:block;font-size:12px;color:var(--sub);margin:10px 0 5px}
.empty{text-align:center;color:var(--sub);padding:26px 10px;font-size:13px}
/* 浮层反馈：每个操作都要让用户看到结果 */
#toastWrap{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));
  right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom));
  z-index:900;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#1c222c;border:1px solid var(--line);border-left:4px solid var(--acc);
  border-radius:10px;padding:11px 13px;box-shadow:0 6px 24px rgba(0,0,0,.5);
  animation:toastIn .18s ease-out;pointer-events:auto}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--bad)}
.toast.warn{border-left-color:var(--warn)}
.toast .t{font-size:13.5px;font-weight:600;line-height:1.4}
.toast .d{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.5}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .22s ease-in forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
/* 多维特性 X/Y 表 */
.axisTable{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px}
.axisTable th{color:var(--sub);font-weight:500;text-align:left;padding:6px 8px;
  border-bottom:1px solid var(--line)}
.axisTable td{padding:5px 6px;vertical-align:top;border-bottom:1px solid var(--line)}
.axisCell{width:100%;min-height:44px;padding:8px;font-size:12.5px;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.axisCell:active{border-color:var(--acc)}
.axisCell .meta{display:block;font-size:10.5px;color:var(--sub);margin-top:2px}
/* 参数详情独立页 */
.paramDetail{padding:14px;background:var(--card);border-radius:12px;margin-bottom:12px}
.pdHeader{margin-bottom:12px}
.pdName{font-size:17px;font-weight:600}
.pdPath{font-size:12px;color:var(--sub);margin-top:4px}
.pdMeta{margin-bottom:14px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pdRow{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.pdRow>span:first-child{color:var(--sub)}
.enumList{margin-top:10px;max-height:200px;overflow-y:auto}
.enumItem{padding:5px 0;font-size:12.5px;border-bottom:1px solid var(--line)}
.codSearch{margin-bottom:10px}
.codSearch input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:14px}
.codSearch input:focus{border-color:var(--acc)}
.pdCurrent{color:var(--acc);font-size:15px}
.pdCurrent b{color:var(--acc)}
.paramDetail label{margin-bottom:8px;font-size:13px;color:var(--sub)}
.paramDetail .acts{margin-top:16px}
/* 特殊功能列表 */
.specialList{display:flex;flex-direction:column;gap:10px}
.specialItem{padding:12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.siName{font-size:15px;font-weight:500}
.siMeta{font-size:11.5px;color:var(--sub);margin:4px 0 8px}
.siActs{display:flex;gap:8px}
.siActs button{flex:1;min-height:36px;font-size:12.5px;padding:6px 4px}
/* DTC 显示 */
.dtcList{margin-top:12px}
.dtcItem{padding:10px;margin-bottom:8px;background:var(--card);border-radius:8px;border-left:3px solid var(--acc)}
.dtcCode{font-size:14px;font-weight:600;font-family:monospace}
.dtcDesc{font-size:12px;color:var(--sub);margin-top:3px}
.dtcNone{padding:20px;text-align:center;color:var(--sub);font-size:14px}
/* 规则编码 */
.ruleCoding{display:flex;flex-direction:column;gap:12px}
.ruleGroup{background:var(--card);border-radius:10px;padding:12px}
.ruleGroupTitle{font-size:14px;font-weight:600;margin-bottom:10px;color:var(--acc)}
.ruleRow{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.ruleRow:last-child{border-bottom:none}
.ruleName{font-size:12.5px;flex:1;margin-right:10px}
.ruleName small{color:var(--sub);font-size:10.5px}
.ruleInput{flex-shrink:0}
.ruleInput select,.ruleInput input{padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--btn);color:var(--txt);font-size:12px;max-width:120px}
/* 全屏加载遮罩 */
#loadingMask{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.75);
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.lmBox{text-align:center;padding:30px 40px;background:var(--card);border-radius:16px;max-width:80%}
.lmSpinner{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--acc);
  border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.lmTitle{font-size:16px;font-weight:600;margin-bottom:6px}
.lmDetail{font-size:12.5px;color:var(--sub);line-height:1.5}
/* 开关 / 下拉 */
.switchRow{display:flex;gap:8px;margin:8px 0}
.swBtn{flex:1;min-height:48px;font-size:15px;border-radius:10px}
.swBtn.sel{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
select{appearance:none;-webkit-appearance:none}
.hint{font-size:11.5px;color:var(--sub);margin-top:8px;line-height:1.6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;
  align-items:flex-end;justify-content:center;z-index:50}
.modal.show{display:flex}
.modal .body{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;
  padding:16px calc(15px + env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom)) calc(15px + env(safe-area-inset-left,0px));max-height:82vh;overflow:auto}
.modal h3{margin:0 0 12px;font-size:16px}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;-webkit-overflow-scrolling:touch}
.scroll-x button{flex:0 0 auto;min-height:38px;padding:8px 13px;font-size:13px}
.scroll-x button.sel{background:var(--acc);border-color:var(--acc);color:#fff}
</style>
</head>
<body>

<div id="toastWrap"></div>
<div id="safeTop" aria-hidden="true"></div>
<header>
  <h1>Porsche Coder</h1>
  <span class="badge" id="linkBadge">未连接</span>
</header>

<main>

  <!-- ① 连接 -->
  <section>
    <h2><span class="num">1</span>连接适配器</h2>
    <div class="row">
      <label>选择接头类型</label>
      <select id="adapterType">
        <option value="auto">自动识别</option>
        <option value="vlinker">vLinker / V-LINK 系列</option>
        <option value="elm">通用 ELM327</option>
        <option value="obdkey">OBDKey</option>
      </select>
      <button id="btnDoctor" class="primary">连接自检</button>
      <button id="btnScan" disabled>地址扫描</button>
      <button id="btnDisc" disabled>断开</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="btnSim">模拟模式</button>
    </div>
    <div class="hint">选择接头类型后接上 OBD 接头 → 点「连接自检」。没接头可以点「模拟模式」，
      离线体验全部车型和功能（读写都会走模拟车，不碰真车）。</div>
  </section>

  <!-- ② 功能导航（参考诊断仪层级：功能 → 车系组 → 车型 → 二级功能 → 系统 → 功能 → 条目）-->
  <section id="secNav">
    <h2><span class="num">2</span><span id="navTitle">请选择车型</span>
      <button id="btnBack" class="backBtn" style="display:none">‹ 返回</button>
    </h2>
    <div class="crumb" id="crumb"></div>
    <div id="searchWrap">
      <input id="searchIn" placeholder="搜索 …" autocomplete="off">
    </div>
    <div id="navList" class="list" style="margin-top:10px"></div>
    <div id="navEmpty" class="empty" style="display:none">没有匹配项</div>
    <div class="hint" id="navHint"></div>
  </section>

  <!-- ④ 参数详情 -->
  <section id="secParam" style="display:none">
    <h2><span class="num">4</span>参数</h2>
    <div id="paramBox"></div>
  </section>

  <!-- ⑤ 日志 -->
  <section>
    <h2><span class="num">5</span>日志</h2>
    <div class="log" id="log"></div>
    <div class="row" style="margin-top:10px">
      <button id="btnBackup">备份编码块</button>
      <button id="btnExport">导出备份</button>
      <button id="btnCopy">复制</button>
      <button id="btnShare" class="primary">分享</button>
    </div>
  </section>

</main>

<!-- 值选择弹层 -->
<div class="modal" id="valueModal">
  <div class="body">
    <h3 id="vmTitle">选择目标值</h3>
    <div class="scroll-x" id="vmOpts"></div>
    <label>或输入数值</label>
    <input id="vmInput" type="number" inputmode="numeric">
    <div class="row" style="margin-top:14px">
      <button id="vmCancel">取消</button>
      <button id="vmOk" class="primary">确认写入</button>
    </div>
    <div class="hint" id="vmHint"></div>
  </div>
</div>

<!-- 分享弹层 -->
<div class="modal" id="shareModal">
  <div class="body">
    <h3>分享</h3>
    <textarea id="shareTa" style="width:100%;height:170px;font:12px/1.5 ui-monospace,monospace;
      background:var(--btn);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px"></textarea>
    <div class="row" style="margin-top:12px">
      <button id="mClose">关闭</button>
      <button id="mCopy">复制</button>
      <button id="mShare" class="primary">系统分享</button>
    </div>
  </div>
</div>

<script type="module" src="app.bundle.js"></script>
</body>
</html>
